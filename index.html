<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1B6B58">
<style>html{color-scheme:light;-webkit-text-size-adjust:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Qada Solat</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one column. Backup banner, hero total, today's goal, five prayer rows (hues follow the day from dawn to night), history, backup. Popups for adding, editing and logging by date. */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --surface2:#E7EDEA; --fg:#14211D; --muted:#566862; --line:#D3DDD8;
  --accent:#1B6B58; --accent-fg:#FFFFFF; --danger:#B3362E; --on-danger:#FFFFFF;
  --p-subuh:#4B5BB5; --p-zohor:#B8901A; --p-asar:#CC7A22; --p-maghrib:#BC4A58; --p-isyak:#2F3B73;
  --f-display:'Fraunces',Georgia,'Times New Roman',serif;
  --f-body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1613; --surface:#16211D; --surface2:#1F2D28; --fg:#E6EFEB; --muted:#9AADA6; --line:#2B3B35;
    --accent:#4FB79A; --accent-fg:#06241C; --danger:#F07A70; --on-danger:#2A0A07;
    --p-subuh:#8F9CFF; --p-zohor:#E0B83F; --p-asar:#F0A04B; --p-maghrib:#E8788A; --p-isyak:#8C9BDB;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1613; --surface:#16211D; --surface2:#1F2D28; --fg:#E6EFEB; --muted:#9AADA6; --line:#2B3B35;
  --accent:#4FB79A; --accent-fg:#06241C; --danger:#F07A70; --on-danger:#2A0A07;
  --p-subuh:#8F9CFF; --p-zohor:#E0B83F; --p-asar:#F0A04B; --p-maghrib:#E8788A; --p-isyak:#8C9BDB;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg); font-family:var(--f-body); font-size:15px; line-height:1.5;
  padding-block:20px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance}
h1{font-size:26px;line-height:1.15}
h2{font-size:19px;line-height:1.25}
p{margin:0}
button,input,textarea{font:inherit;color:inherit}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.top p{color:var(--muted);margin-top:4px;max-width:44ch}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);flex:none}
.seg button{border:0;background:transparent;padding:7px 12px;min-height:36px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.banner{background:color-mix(in srgb,var(--p-zohor) 16%,var(--surface));border:1px solid var(--p-zohor);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.big{font-family:var(--f-display);font-weight:600;font-size:clamp(46px,13vw,76px);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.goalnum{font-family:var(--f-display);font-weight:600;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.sub{color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>span{display:block;height:100%;width:0;background:var(--c,var(--accent));border-radius:99px;transition:width .3s ease}
.pace{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0;padding:0;list-style:none}
.pace li{background:var(--surface2);border-radius:10px;padding:9px 12px;min-width:0}
.pace small{display:block;color:var(--muted);font-size:12px}
.pace b{font-weight:600;font-variant-numeric:tabular-nums}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.prow{padding:14px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:9px}
.prow:first-child{border-top:0;padding-top:2px}
.prow-top,.prow-bot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pname{display:inline-flex;align-items:center;gap:8px;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.prem b{font-family:var(--f-display);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.prem small,.pmeta{color:var(--muted);font-size:13px}
.pmeta{font-variant-numeric:tabular-nums}
.pbtns{display:flex;gap:6px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-height:40px;min-width:44px;padding:0 14px;cursor:pointer;font-weight:500;font-variant-numeric:tabular-nums}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn.small{min-height:34px;padding:0 12px;font-size:14px}
.btn.link{border:0;background:transparent;color:var(--muted);text-decoration:underline;min-width:0;padding:0 6px}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.legend{font-size:13px;color:var(--muted);font-weight:500}
input[type=number],input[type=text],input[type=date]{width:100%;min-height:44px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 12px}
input[type=number]{font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.chip span{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--bg);color:var(--muted);font-weight:500}
.chip span::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip input:checked+span{border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,var(--surface));color:var(--fg)}
.chip input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.qgrid{display:flex;flex-direction:column;gap:10px}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:10px;align-items:center}
.qrow small{display:block;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.preview{background:var(--surface2);border-radius:10px;padding:10px 12px;font-variant-numeric:tabular-nums}
.hint{color:var(--muted);font-size:13px}
.msg{min-height:20px;font-size:13px;color:var(--accent);font-weight:500}
.msg.err{color:var(--danger)}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hitem{padding:12px 0;border-top:1px solid var(--line);display:flex;gap:12px;justify-content:space-between;align-items:flex-start}
.hitem:first-child{border-top:0}
.hbody{min-width:0;display:flex;flex-direction:column;gap:4px}
.htitle{font-weight:600;overflow-wrap:anywhere}
.hsub{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.kind{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:99px;margin-right:8px;vertical-align:1px;background:var(--surface2);color:var(--muted)}
.kind.q{background:color-mix(in srgb,var(--accent) 18%,var(--surface));color:var(--accent)}
.hact{display:flex;gap:6px;flex:none;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.goalrow{gap:8px}
.importbox{background:var(--surface2);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px 12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.status{color:var(--muted);font-size:13px;text-align:center}
.trk-nav{display:flex;align-items:center;gap:8px}
.trk-date{font-family:var(--f-display);font-weight:600;font-size:18px;flex:1;min-width:0;text-align:center}
.trow{padding:12px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.trow:first-child{border-top:0;padding-top:2px}
.stseg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.st{border:1px solid var(--line);background:var(--bg);border-radius:10px;min-height:42px;padding:0 6px;cursor:pointer;font-weight:500;color:var(--muted)}
.st:hover{border-color:var(--accent)}
.st[aria-pressed="true"][data-v="sudah"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.st[aria-pressed="true"][data-v="lewat"]{background:var(--p-zohor);border-color:var(--p-zohor);color:#1B1500;font-weight:600}
.st[aria-pressed="true"][data-v="tinggal"]{background:var(--danger);border-color:var(--danger);color:var(--on-danger);font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-h{font-size:11px;color:var(--muted);text-align:center;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding-bottom:2px}
.cd{border:1px solid transparent;background:var(--surface2);border-radius:10px;min-height:52px;min-width:0;padding:5px 2px 6px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:4px;cursor:pointer;font-variant-numeric:tabular-nums;font-size:13px}
.cd:disabled{opacity:.35;cursor:default}
.cd.today{border-color:var(--accent)}
.cd[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 22%,var(--surface));border-color:var(--accent);font-weight:600}
.dots{display:flex;gap:2px}
.dots i{width:5px;height:5px;border-radius:50%;border:1px solid var(--line);display:block}
.dots i.sudah{background:var(--accent);border-color:var(--accent)}
.dots i.lewat{background:var(--p-zohor);border-color:var(--p-zohor)}
.dots i.tinggal{background:var(--danger);border-color:var(--danger)}
.legend-row{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend-row span{display:inline-flex;align-items:center;gap:6px}
.legend-row i{width:9px;height:9px;border-radius:50%;display:inline-block}
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.calhead strong{font-family:var(--f-display);font-weight:600;font-size:16px;text-align:center;flex:1}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(8,14,12,.55);display:flex;align-items:flex-end;justify-content:center;
  padding-top:env(safe-area-inset-top,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.modal{background:var(--surface);color:var(--fg);width:100%;max-width:520px;max-height:100%;overflow-y:auto;border:1px solid var(--line);
  border-radius:16px 16px 0 0;padding:18px 18px max(18px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(20px,env(safe-area-inset-bottom,0px));z-index:60;
  background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;max-width:calc(100% - 32px)}
@media (min-width:600px){.overlay{align-items:center;padding:20px}.modal{border-radius:16px;max-height:calc(100% - 8px)}}
@media (pointer:coarse){.btn{min-height:44px}.btn.small{min-height:42px}.seg button{min-height:42px}.chip span{min-height:44px}}
@media (max-width:520px){
  #openAdd{width:100%}
  .pbtns{width:100%}
  .pbtns .btn{flex:1}
  .panel{padding:16px}
  .overlay .btn.primary{flex:1}
}
@media (max-width:420px){.fields{gap:8px}.hitem{flex-direction:column}.hact{justify-content:flex-start}}
@media (prefers-reduced-motion:reduce){.bar>span{transition:none}}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Qada Solat</h1>
      <p data-i18n="tagline"></p>
    </div>
    <div class="seg" role="group" aria-label="Bahasa / Language">
      <button type="button" data-lang="ms" aria-pressed="true">BM</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </header>

  <div class="banner" id="backupBanner" role="status" hidden>
    <p id="bannerText"></p>
    <div class="row">
      <button type="button" class="btn primary small" id="bannerNow" data-i18n="bnNow"></button>
      <button type="button" class="btn small" id="bannerLater" data-i18n="bnLater"></button>
    </div>
  </div>

  <section class="panel" aria-live="polite">
    <p class="eyebrow" data-i18n="remaining"></p>
    <p class="big" id="bigNum">0</p>
    <p class="sub" id="heroSub"></p>
    <div class="bar" id="overallBar" hidden><span id="overallFill"></span></div>
    <p class="hint" id="overallPct"></p>
    <div id="paceBox" hidden>
      <p class="eyebrow" data-i18n="paceTitle" style="margin-bottom:8px"></p>
      <ul class="pace" id="pace"></ul>
    </div>
    <div class="row"><button type="button" class="btn primary" id="openAdd" data-i18n="openAdd"></button></div>
  </section>

  <section class="panel" id="trackerPanel">
    <div class="sechead">
      <h2 data-i18n="trkTitle"></h2>
      <span class="hint" id="trkStreak"></span>
    </div>
    <div class="trk-nav">
      <button type="button" class="btn small" id="trkPrev">‹</button>
      <div class="trk-date" id="trkDate" aria-live="polite"></div>
      <button type="button" class="btn small" id="trkNext">›</button>
    </div>
    <div class="row"><button type="button" class="btn small" id="trkToday" data-i18n="trkNow"></button></div>
    <ul class="plist" id="trkList"></ul>
    <p class="hint" id="trkSummary"></p>
    <p class="hint" data-i18n="trkNote"></p>
    <div class="calhead">
      <button type="button" class="btn small" id="calPrev">‹</button>
      <strong id="calTitle"></strong>
      <button type="button" class="btn small" id="calNext">›</button>
    </div>
    <div class="cal" id="calGrid"></div>
    <div class="legend-row" id="calLegend"></div>
  </section>

  <section class="panel" id="dailyPanel" hidden>
    <div class="sechead">
      <h2 data-i18n="today"></h2>
      <span class="hint" id="streakLine"></span>
    </div>
    <p class="goalnum" id="goalNum"></p>
    <div class="bar" id="goalBar"><span id="goalFill"></span></div>
    <p class="msg" id="goalMsg"></p>
    <div class="row goalrow">
      <label for="goalInput" class="legend" data-i18n="goalLabel"></label>
      <button type="button" class="btn small" id="goalMinus" aria-label="−1">−</button>
      <input type="number" id="goalInput" min="0" max="500" inputmode="numeric" style="width:84px;text-align:center">
      <button type="button" class="btn small" id="goalPlus" aria-label="+1">+</button>
    </div>
    <p class="hint" data-i18n="goalHint"></p>
  </section>

  <section class="panel">
    <div class="sechead">
      <h2 data-i18n="perPrayer"></h2>
      <div class="row">
        <button type="button" class="btn small" id="openQada" data-i18n="logByDate"></button>
        <button type="button" class="btn small" id="allOne" data-i18n="allOne"></button>
      </div>
    </div>
    <ul class="plist" id="plist"></ul>
  </section>

  <div class="overlay" id="addModal" hidden>
  <section class="modal" role="dialog" aria-modal="true" aria-labelledby="addTitle">
    <div class="sechead">
      <h2 id="addTitle"></h2>
      <button type="button" class="btn small" id="closeAdd">✕</button>
    </div>
    <p class="hint" data-i18n="addHint"></p>
    <form id="addForm" class="panel" style="border:0;padding:0;background:transparent" novalidate>
      <div class="fields">
        <div class="field"><label for="fy" data-i18n="years"></label><input type="number" id="fy" min="0" max="150" inputmode="numeric" placeholder="0"></div>
        <div class="field"><label for="fm" data-i18n="months"></label><input type="number" id="fm" min="0" max="1800" inputmode="numeric" placeholder="0"></div>
        <div class="field"><label for="fd" data-i18n="days"></label><input type="number" id="fd" min="0" max="40000" inputmode="numeric" placeholder="0"></div>
      </div>
      <div class="field">
        <span class="legend" data-i18n="which"></span>
        <div class="chips" role="group">
          <label class="chip" style="--c:var(--p-subuh)"><input type="checkbox" id="c_subuh" checked><span data-pn="subuh"></span></label>
          <label class="chip" style="--c:var(--p-zohor)"><input type="checkbox" id="c_zohor" checked><span data-pn="zohor"></span></label>
          <label class="chip" style="--c:var(--p-asar)"><input type="checkbox" id="c_asar" checked><span data-pn="asar"></span></label>
          <label class="chip" style="--c:var(--p-maghrib)"><input type="checkbox" id="c_maghrib" checked><span data-pn="maghrib"></span></label>
          <label class="chip" style="--c:var(--p-isyak)"><input type="checkbox" id="c_isyak" checked><span data-pn="isyak"></span></label>
        </div>
      </div>
      <div class="field">
        <label for="fnote" data-i18n="note"></label>
        <input type="text" id="fnote" maxlength="200" data-i18n-ph="notePh" autocomplete="off">
      </div>
      <p class="preview" id="preview"></p>
      <div class="row">
        <button type="submit" class="btn primary" id="addSubmit"></button>
        <span class="msg" id="addMsg" role="status"></span>
      </div>
    </form>
  </section>
  </div>

  <div class="overlay" id="qadaModal" hidden>
  <section class="modal" role="dialog" aria-modal="true" aria-labelledby="qTitle">
    <div class="sechead">
      <h2 id="qTitle" data-i18n="qTitle"></h2>
      <button type="button" class="btn small" id="closeQada">✕</button>
    </div>
    <p class="hint" data-i18n="qHint"></p>
    <form id="qadaForm" class="panel" style="border:0;padding:0;background:transparent" novalidate>
      <div class="field">
        <label for="qDate" data-i18n="qDate"></label>
        <input type="date" id="qDate">
      </div>
      <div class="qgrid">
        <div class="qrow" style="--c:var(--p-subuh)"><span><span class="pname"><i class="dot"></i><span data-pn="subuh"></span></span><small id="qr_subuh"></small></span><input type="number" id="q_subuh" min="0" inputmode="numeric" placeholder="0"></div>
        <div class="qrow" style="--c:var(--p-zohor)"><span><span class="pname"><i class="dot"></i><span data-pn="zohor"></span></span><small id="qr_zohor"></small></span><input type="number" id="q_zohor" min="0" inputmode="numeric" placeholder="0"></div>
        <div class="qrow" style="--c:var(--p-asar)"><span><span class="pname"><i class="dot"></i><span data-pn="asar"></span></span><small id="qr_asar"></small></span><input type="number" id="q_asar" min="0" inputmode="numeric" placeholder="0"></div>
        <div class="qrow" style="--c:var(--p-maghrib)"><span><span class="pname"><i class="dot"></i><span data-pn="maghrib"></span></span><small id="qr_maghrib"></small></span><input type="number" id="q_maghrib" min="0" inputmode="numeric" placeholder="0"></div>
        <div class="qrow" style="--c:var(--p-isyak)"><span><span class="pname"><i class="dot"></i><span data-pn="isyak"></span></span><small id="qr_isyak"></small></span><input type="number" id="q_isyak" min="0" inputmode="numeric" placeholder="0"></div>
      </div>
      <div class="row">
        <button type="submit" class="btn primary" data-i18n="qSave"></button>
        <span class="msg" id="qMsg" role="status"></span>
      </div>
    </form>
  </section>
  </div>
  <div class="toast" id="toast" role="status" hidden></div>

  <section class="panel">
    <div class="sechead">
      <h2 data-i18n="histTitle"></h2>
      <div class="seg" role="group">
        <button type="button" data-filter="all" aria-pressed="true" data-i18n="fAll"></button>
        <button type="button" data-filter="tinggal" aria-pressed="false" data-i18n="fMissed"></button>
        <button type="button" data-filter="qada" aria-pressed="false" data-i18n="fQada"></button>
      </div>
    </div>

let lang='ms';
try{const l=localStorage.getItem('qada.lang');if(l==='en'||l==='ms')lang=l;}catch(e){}
const t=(k,p)=>{let s=(I18N[lang]&&I18N[lang][k])||I18N.ms[k]||k;if(p)for(const key in p)s=s.split('{'+key+'}').join(p[key]);return s;};
const $=s=>document.querySelector(s);
const qsa=s=>Array.from(document.querySelectorAll(s));
const nf=n=>Number(n).toLocaleString(lang==='ms'?'ms-MY':'en-GB');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const defaultSettings=()=>({goal:5,lastBackup:0,snoozeUntil:0});
const state={entries:new Map(),settings:defaultSettings(),mode:'loading',slow:false,filter:'all',limit:50,pendingDelete:null,importItems:null,importGoal:null,editId:null,selDate:null,cal:null};
let db=null,uid=null,downloads=null,slowTimer=null;
const chains=new Map();

/* ---------- helpers ---------- */
function keyOf(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function today(){return keyOf(new Date());}
function fmtDate(s){const a=String(s).split('-').map(Number);return new Date(a[0],a[1]-1,a[2]).toLocaleDateString(lang==='ms'?'ms-MY':'en-GB',{day:'numeric',month:'short',year:'numeric'});}
function dayDiff(a,b){
  const x=String(a).split('-').map(Number),y=String(b).split('-').map(Number);
  return Math.round((Date.UTC(y[0],y[1]-1,y[2])-Date.UTC(x[0],x[1]-1,x[2]))/864e5);
}
function dur(d){
  const y=Math.floor(d/365),r=d%365,m=Math.floor(r/30),dd=r%30,parts=[];
  if(y)parts.push(nf(y)+' '+t('yr'));
  if(m)parts.push(m+' '+t('mo'));
  if(dd||!parts.length)parts.push(dd+' '+t('dy'));
  return parts.join(' ');
}
function newId(){return 't-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
const ID_OK=/^[A-Za-z0-9_-]{1,64}$/;
const idUsable=id=>ID_OK.test(id)&&id!=='settings';
function cleanSettings(r){
  const d=defaultSettings();
  if(!r||typeof r!=='object')return d;
  const g=Math.floor(Number(r.goal));if(isFinite(g)&&g>=0)d.goal=Math.min(g,500);
  const lb=Number(r.lastBackup);if(isFinite(lb)&&lb>0)d.lastBackup=lb;
  const sn=Number(r.snoozeUntil);if(isFinite(sn)&&sn>0)d.snoozeUntil=sn;
  return d;
}
function clean(r){
  if(!r||typeof r!=='object')return null;
  const at=Number(r.at)||0;
  if(r.kind==='tinggal'){
    const cl=(v,max)=>{const n=Math.floor(Number(v));return isFinite(n)&&n>0?Math.min(n,max):0;};
    const y=cl(r.years,150),m=cl(r.months,1800),d=cl(r.days,40000);
    const set=new Set(Array.isArray(r.prayers)?r.prayers:[]);
    const prayers=PR.filter(p=>set.has(p));
    const total=y*365+m*30+d;
    if(!prayers.length||total<=0)return null;
    return {kind:'tinggal',years:y,months:m,days:d,totalDays:total,prayers:prayers,note:String(r.note||'').slice(0,200),at:at};
  }
  if(r.kind==='harian'){
    const date=String(r.date);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||date<'2000-01-01')return null;
    const src=r.status&&typeof r.status==='object'?r.status:{};
    const st={};let any=false;
    PR.forEach(p=>{if(ST.indexOf(src[p])>=0){st[p]=src[p];any=true;}});
    if(!any)return null;
    return {kind:'harian',date:date,status:st,at:at};
  }
  if(r.kind==='qada'){
    if(PR.indexOf(r.prayer)<0)return null;
    let c=Math.floor(Number(r.count));
    if(!(c>=1))return null;
    c=Math.min(c,1000000);
    const date=/^\d{4}-\d{2}-\d{2}$/.test(String(r.date))?String(r.date):today();
    return {kind:'qada',prayer:r.prayer,date:date,count:c,at:at};
  }
  return null;
}
function totals(){
  const tot={},done={};
  PR.forEach(p=>{tot[p]=0;done[p]=0;});
  state.entries.forEach(e=>{
    if(e.kind==='tinggal'){e.prayers.forEach(p=>{tot[p]+=e.totalDays;});}
    else if(e.kind==='qada'){done[e.prayer]+=e.count;}
    else if(e.kind==='harian'){PR.forEach(p=>{if(e.status[p]==='tinggal')tot[p]+=1;});}
  });
  return {tot:tot,done:done};
}
function perDay(){
  const per={};
  state.entries.forEach(e=>{if(e.kind==='qada')per[e.date]=(per[e.date]||0)+e.count;});
  return per;
}
function runStreak(ok){
  const dates=Object.keys(ok).filter(k=>ok[k]).sort();
  let best=0,run=0,prev=null;
  dates.forEach(k=>{
    if(prev&&dayDiff(prev,k)===1)run++;else run=1;
    if(run>best)best=run;
    prev=k;
  });
  const d=new Date();
  if(!ok[keyOf(d)])d.setDate(d.getDate()-1);
  let cur=0;
  while(ok[keyOf(d)]){cur++;d.setDate(d.getDate()-1);}
  return {cur:cur,best:best};
}
function streaks(goal,per){
  if(!goal)return {cur:0,best:0};
  const ok={};
  Object.keys(per).forEach(k=>{if(per[k]>=goal)ok[k]=true;});
  return runStreak(ok);
}
function fullDays(){
  const ok={};
  state.entries.forEach(e=>{
    if(e.kind==='harian'&&PR.every(p=>e.status[p]==='sudah'||e.status[p]==='lewat'))ok[e.date]=true;
  });
  return ok;
}
function shiftDate(k,n){const a=k.split('-').map(Number);return keyOf(new Date(a[0],a[1]-1,a[2]+n));}
function stOf(date){const e=state.entries.get('h-'+date);return e&&e.kind==='harian'?e.status:{};}

/* ---------- storage ---------- */
function setStatusErr(){$('#statusLine').textContent=t('saveErr');}
function enqueue(id,fn){
  const prev=chains.get(id)||Promise.resolve();
  const next=prev.then(fn).catch(setStatusErr);
  chains.set(id,next);
  next.then(()=>{if(chains.get(id)===next)chains.delete(id);});
  return next;
}
function colRef(){return db.collection('data/users/'+uid);}
function saveLocal(){try{localStorage.setItem('qada.entries',JSON.stringify(Array.from(state.entries)));}catch(e){}}
function saveSettingsLocal(){try{localStorage.setItem('qada.settings',JSON.stringify(state.settings));}catch(e){}}
function loadLocal(){
  try{
    const raw=JSON.parse(localStorage.getItem('qada.entries')||'[]');
    const m=new Map();
    raw.forEach(pair=>{const rec=clean(pair[1]);if(rec&&idUsable(String(pair[0])))m.set(String(pair[0]),rec);});
    state.entries=m;
  }catch(e){}
  try{state.settings=cleanSettings(JSON.parse(localStorage.getItem('qada.settings')||'null'));}catch(e){}
}
function put(id,rec){
  state.entries.set(id,rec);
  renderAll();
  if(db){enqueue(id,()=>colRef().doc(id).set(rec));}else{saveLocal();}
}
function remove(id){
  state.entries.delete(id);
  renderAll();
  if(db){enqueue(id,()=>colRef().doc(id).delete());}else{saveLocal();}
}
function putSettings(patch){
  state.settings=Object.assign({},state.settings,patch);
  renderAll();
  const snap=Object.assign({},state.settings);
  if(db){enqueue('settings',()=>colRef().doc('settings').set(snap));}else{saveSettingsLocal();}
}
async function bulkApply(items,replace){
  const next=replace?new Map():new Map(state.entries);
  const keep=new Set(items.map(i=>i.id));
  const removeIds=replace?Array.from(state.entries.keys()).filter(id=>!keep.has(id)):[];
  items.forEach(i=>next.set(i.id,i.rec));
  state.entries=next;
  renderAll();
  if(!db){saveLocal();return;}
  const ops=removeIds.map(id=>()=>enqueue(id,()=>colRef().doc(id).delete()))
    .concat(items.map(i=>()=>enqueue(i.id,()=>colRef().doc(i.id).set(i.rec))));
  for(let i=0;i<ops.length;i+=8){await Promise.all(ops.slice(i,i+8).map(f=>f()));}
}
function goLocal(){loadLocal();state.mode='local';renderAll();}
function startDb(){
  slowTimer=setTimeout(()=>{if(state.mode==='loading'){state.slow=true;renderStatus();}},10000);
  colRef().onSnapshot(snap=>{
    clearTimeout(slowTimer);
    const m=new Map();let st=null;
    snap.docs.forEach(d=>{
      if(d.id==='settings'){st=cleanSettings(d.data());return;}
      const rec=clean(d.data());
      if(rec&&idUsable(d.id))m.set(d.id,rec);
    });
    state.entries=m;state.settings=st||defaultSettings();state.mode='db';state.slow=false;
    renderAll();
  },()=>{clearTimeout(slowTimer);db=null;goLocal();});
}

/* ---------- qada actions ---------- */
function addQada(p,n){
  const T=totals();
  n=Math.min(n,T.tot[p]-T.done[p]);
  if(n<=0)return;
  const date=today(),id='q-'+date+'-'+p,ex=state.entries.get(id);
  put(id,{kind:'qada',prayer:p,date:date,count:(ex&&ex.kind==='qada'?ex.count:0)+n,at:Date.now()});
}
function undoQada(p){
  let best=null;
  state.entries.forEach((e,id)=>{
    if(e.kind!=='qada'||e.prayer!==p)return;
    if(!best||e.date>best.e.date||(e.date===best.e.date&&e.at>best.e.at))best={id:id,e:e};
  });
  if(!best)return;
  if(best.e.count<=1)remove(best.id);
  else put(best.id,{kind:'qada',prayer:p,date:best.e.date,count:best.e.count-1,at:Date.now()});
}

function setStatus(date,p,v){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||date>today()||date<'2000-01-01')return;
  if(PR.indexOf(p)<0||ST.indexOf(v)<0)return;
  const id='h-'+date,ex=state.entries.get(id);
  const st=Object.assign({},ex&&ex.kind==='harian'?ex.status:{});
  if(st[p]===v)delete st[p];else st[p]=v;
  if(!Object.keys(st).length){if(ex)remove(id);return;}
  put(id,{kind:'harian',date:date,status:st,at:Date.now()});
}

/* ---------- render ---------- */
function renderTracker(){
  const sel=state.selDate,td=today(),stt=stOf(sel);
  $('#trkDate').textContent=(sel===td?t('trkNow')+' · ':'')+fmtDate(sel);
  $('#trkNext').disabled=sel>=td;
  $('#trkPrev').disabled=sel<='2000-01-01';
  $('#trkToday').hidden=sel===td;
  $('#trkList').innerHTML=PR.map(p=>{
    const name=t('p_'+p);
    return '<li class="trow" style="--c:var(--p-'+p+')"><span class="pname"><i class="dot"></i>'+esc(name)+'</span>'+
      '<div class="stseg" role="group" aria-label="'+esc(name)+'">'+
      ST.map(v=>'<button type="button" class="st" data-tp="'+p+'" data-v="'+v+'" aria-pressed="'+(stt[p]===v)+'">'+esc(t('st_'+v))+'</button>').join('')+
      '</div></li>';
  }).join('');
  $('#trkSummary').textContent=t('trkSummary',{n:Object.keys(stt).length});
  const s=runStreak(fullDays());
  $('#trkStreak').textContent=t('trkStreak',{n:s.cur})+' · '+t('best',{n:s.best});
  renderCalendar();
}
function renderCalendar(){
  const y=state.cal.y,m=state.cal.m,td=today(),loc=lang==='ms'?'ms-MY':'en-GB';
  const first=new Date(y,m,1),days=new Date(y,m+1,0).getDate(),lead=first.getDay();
  $('#calTitle').textContent=first.toLocaleDateString(loc,{month:'long',year:'numeric'});
  let h='';
  for(let i=0;i<7;i++){h+='<div class="cal-h" aria-hidden="true">'+esc(new Date(2023,0,1+i).toLocaleDateString(loc,{weekday:'short'}))+'</div>';}
  for(let i=0;i<lead;i++)h+='<div></div>';
  for(let d=1;d<=days;d++){
    const key=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const st=stOf(key),c={sudah:0,lewat:0,tinggal:0};
    PR.forEach(p=>{if(st[p])c[st[p]]++;});
    const label=fmtDate(key)+': '+t('calAria',{a:c.sudah,b:c.lewat,c:c.tinggal});
    h+='<button type="button" class="cd'+(key===td?' today':'')+'" data-date="'+key+'" aria-pressed="'+(key===state.selDate)+'" aria-label="'+esc(label)+'"'+(key>td?' disabled':'')+'>'+
      '<span>'+d+'</span><span class="dots" aria-hidden="true">'+PR.map(p=>'<i class="'+(st[p]||'')+'"></i>').join('')+'</span></button>';
  }
  $('#calGrid').innerHTML=h;
  const n=new Date();
  $('#calNext').disabled=(y*12+m)>=(n.getFullYear()*12+n.getMonth());
}
function renderLegend(){
  const col={sudah:'var(--accent)',lewat:'var(--p-zohor)',tinggal:'var(--danger)'};
  $('#calLegend').innerHTML=ST.map(v=>'<span><i style="background:'+col[v]+'"></i>'+esc(t('st_'+v))+'</span>').join('');
}
function renderHero(){
  const T=totals();
  let total=0,rem=0,done=0;
  PR.forEach(p=>{total+=T.tot[p];rem+=Math.max(0,T.tot[p]-T.done[p]);done+=Math.min(T.done[p],T.tot[p]);});
  $('#bigNum').textContent=nf(rem);
  const bar=$('#overallBar'),pace=$('#paceBox');
  if(total===0){
    $('#heroSub').textContent=t('heroNone');bar.hidden=true;$('#overallPct').textContent='';pace.hidden=true;return;
  }
  bar.hidden=false;
  const pct=Math.floor(done/total*100);
  $('#overallFill').style.width=(done/total*100)+'%';
  $('#overallPct').textContent=t('progress',{p:pct,d:nf(done)});
  if(rem===0){$('#heroSub').textContent=t('heroDone');pace.hidden=true;return;}
  $('#heroSub').textContent=t('heroSub',{n:nf(total)});
  pace.hidden=false;
  $('#pace').innerHTML=[5,10,20].map(n=>'<li><small>'+esc(t('paceItem',{n:n}))+'</small><b>'+esc(dur(Math.ceil(rem/n)))+'</b></li>').join('');
}
function renderDaily(){
  const T=totals();
  let total=0;PR.forEach(p=>{total+=T.tot[p];});
  const panel=$('#dailyPanel');
  if(total===0){panel.hidden=true;return;}
  panel.hidden=false;
  const goal=state.settings.goal,per=perDay(),dn=per[today()]||0;
  $('#goalNum').textContent=goal?t('goalOf',{d:nf(dn),g:nf(goal)}):t('todayDone',{d:nf(dn)});
  $('#goalBar').hidden=!goal;
  $('#goalFill').style.width=(goal?Math.min(100,dn/goal*100):0)+'%';
  $('#goalMsg').textContent=(goal&&dn>=goal)?t('goalHit'):'';
  if(goal){const s=streaks(goal,per);$('#streakLine').textContent=t('streak',{n:s.cur})+' · '+t('best',{n:s.best});}
  else $('#streakLine').textContent='';
  if(document.activeElement!==$('#goalInput'))$('#goalInput').value=goal;
}
function renderPrayers(){
  const T=totals();
  let anyLeft=false;
  $('#plist').innerHTML=PR.map(p=>{
    const tt=T.tot[p],dn=Math.min(T.done[p],tt),rem=Math.max(0,tt-T.done[p]);
    if(rem>0)anyLeft=true;
    const pct=tt?(dn/tt*100):0,name=t('p_'+p);
    return '<li class="prow" style="--c:var(--p-'+p+')">'+
      '<div class="prow-top"><span class="pname"><i class="dot"></i>'+esc(name)+'</span>'+
      '<span class="prem"><b>'+nf(rem)+'</b> <small>'+esc(t('remLabel'))+'</small></span></div>'+
      '<div class="bar"><span style="width:'+pct+'%"></span></div>'+
      '<div class="prow-bot"><span class="pmeta">'+esc(t('doneMeta',{d:nf(dn),t:nf(tt)}))+'</span>'+
      '<span class="pbtns">'+
      '<button type="button" class="btn small" data-act="dec" data-p="'+p+'" aria-label="'+esc(t('decAria',{p:name}))+'"'+(T.done[p]>0?'':' disabled')+'>−1</button>'+
      '<button type="button" class="btn small" data-act="inc" data-n="1" data-p="'+p+'" aria-label="'+esc(t('incAria',{p:name,n:1}))+'"'+(rem>0?'':' disabled')+'>+1</button>'+
      '<button type="button" class="btn small" data-act="inc" data-n="5" data-p="'+p+'" aria-label="'+esc(t('incAria',{p:name,n:5}))+'"'+(rem>0?'':' disabled')+'>+5</button>'+
      '</span></div></li>';
  }).join('');
  $('#allOne').disabled=!anyLeft;
  $('#openQada').disabled=!anyLeft;
}
function renderHistory(){
  let list=Array.from(state.entries).map(a=>({id:a[0],e:a[1]})).filter(x=>x.e.kind!=='harian');
  if(state.filter!=='all')list=list.filter(x=>x.e.kind===state.filter);
  list.sort((a,b)=>b.e.at-a.e.at);
  const shown=list.slice(0,state.limit);
  $('#moreBtn').hidden=list.length<=state.limit;
  if(!shown.length){$('#hist').innerHTML='<li class="hsub" style="padding:8px 0">'+esc(t('histEmpty'))+'</li>';return;}
  $('#hist').innerHTML=shown.map(x=>{
    const e=x.e;let title,sub;
    if(e.kind==='tinggal'){
      title='<span class="kind">'+esc(t('fMissed'))+'</span>'+esc(t('missedTitle',{dur:dur(e.totalDays)}));
      sub=esc(e.prayers.map(p=>t('p_'+p)).join(', '))+' · '+esc(t('solatCount',{n:nf(e.totalDays*e.prayers.length)}));
      if(e.note)sub+='<br>'+esc(e.note);
    }else{
      title='<span class="kind q">'+esc(t('fQada'))+'</span>'+esc(t('qadaTitle',{p:t('p_'+e.prayer),n:nf(e.count)}));
      sub=esc(fmtDate(e.date));
    }
    const asking=state.pendingDelete===x.id;
    const editBtn=e.kind==='tinggal'?'<button type="button" class="btn link" data-hact="edit" data-id="'+esc(x.id)+'">'+esc(t('edit'))+'</button>':'';
    const act=asking
      ?'<span class="hsub">'+esc(t('delAsk'))+'</span><button type="button" class="btn small danger" data-hact="yes" data-id="'+esc(x.id)+'">'+esc(t('delYes'))+'</button><button type="button" class="btn small" data-hact="no">'+esc(t('cancel'))+'</button>'
      :editBtn+'<button type="button" class="btn link" data-hact="ask" data-id="'+esc(x.id)+'">'+esc(t('del'))+'</button>';
    return '<li class="hitem"><div class="hbody"><div class="htitle">'+title+'</div><div class="hsub">'+sub+'</div></div><div class="hact">'+act+'</div></li>';
  }).join('');
}
function renderBanner(){
  const b=$('#backupBanner'),s=state.settings,now=Date.now();
  if(!state.entries.size||state.mode==='loading'){b.hidden=true;return;}
  const days=s.lastBackup?Math.floor((now-s.lastBackup)/864e5):null;
  const due=!s.lastBackup||days>=7;
  if(!due||s.snoozeUntil>now){b.hidden=true;return;}
  $('#bannerText').textContent=s.lastBackup?t('bnOld',{n:days}):t('bnNever');
  b.hidden=false;
}
function renderBackupLine(){
  const lb=state.settings.lastBackup;
  $('#lastBackupLine').textContent=lb?t('lastBackup',{d:fmtDate(keyOf(new Date(lb)))}):t('lastBackupNone');
}
function renderStatus(){
  let k='sDb';
  if(state.mode==='loading')k=state.slow?'sSlow':'sLoading';
  else if(state.mode==='local')k='sLocal';
  $('#statusLine').textContent=t(k);
}
function renderPreview(){
  const f=readForm();
  $('#preview').textContent=(f.total>0&&f.prayers.length)
    ?t('preview',{d:nf(f.total),p:f.prayers.length,n:nf(f.total*f.prayers.length)})
    :t('previewEmpty');
}
function updateAddLabels(){
  $('#addTitle').textContent=t(state.editId?'editTitle':'addTitle');
  $('#addSubmit').textContent=t(state.editId?'save':'add');
}
function renderAll(){renderHero();renderTracker();renderDaily();renderPrayers();renderHistory();renderBanner();renderBackupLine();renderStatus();}
function applyLang(){
  document.documentElement.lang=lang;
  qsa('[data-i18n]').forEach(el=>{el.textContent=t(el.dataset.i18n);});
  qsa('[data-i18n-ph]').forEach(el=>{el.placeholder=t(el.dataset.i18nPh);});
  qsa('[data-pn]').forEach(el=>{el.textContent=t('p_'+el.dataset.pn);});
  qsa('[data-lang]').forEach(b=>{b.setAttribute('aria-pressed',String(b.dataset.lang===lang));});
  $('#closeAdd').setAttribute('aria-label',t('close'));
  $('#closeQada').setAttribute('aria-label',t('close'));
  $('#trkPrev').setAttribute('aria-label',t('trkPrevAria'));
  $('#trkNext').setAttribute('aria-label',t('trkNextAria'));
  $('#calPrev').setAttribute('aria-label',t('calPrevAria'));
  $('#calNext').setAttribute('aria-label',t('calNextAria'));
  renderLegend();
  updateAddLabels();
  renderPreview();
}

/* ---------- forms ---------- */
function readForm(){
  const n=(id,max)=>{const v=Math.floor(Number($(id).value));return isFinite(v)&&v>0?Math.min(v,max):0;};
  const y=n('#fy',150),m=n('#fm',1800),d=n('#fd',40000);
  return {y:y,m:m,d:d,prayers:PR.filter(p=>$('#c_'+p).checked),total:y*365+m*30+d};
}
$('#addForm').addEventListener('input',renderPreview);
$('#addForm').addEventListener('submit',e=>{
  e.preventDefault();
  const f=readForm(),msg=$('#addMsg');
  if(!(f.total>0&&f.prayers.length)){msg.className='msg err';msg.textContent=t('previewEmpty');return;}
  const rec={kind:'tinggal',years:f.y,months:f.m,days:f.d,totalDays:f.total,prayers:f.prayers,note:$('#fnote').value.trim().slice(0,200),at:Date.now()};
  const old=state.editId?state.entries.get(state.editId):null;
  if(old&&old.kind==='tinggal'){rec.at=old.at;put(state.editId,rec);closeM();showToast(t('updated'));}
  else{put(newId(),rec);closeM();showToast(t('added'));}
  ['#fy','#fm','#fd','#fnote'].forEach(s=>{$(s).value='';});
  renderPreview();
});
$('#qadaForm').addEventListener('submit',e=>{
  e.preventDefault();
  const msg=$('#qMsg'),date=$('#qDate').value;
  const err=text=>{msg.className='msg err';msg.textContent=text;};
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||date>today()||date<'2000-01-01'){err(t('qDateBad'));return;}
  const T=totals(),adds=[];
  for(const p of PR){
    const v=Math.floor(Number($('#q_'+p).value));
    const n=isFinite(v)&&v>0?Math.min(v,1000000):0;
    if(!n)continue;
    const rem=Math.max(0,T.tot[p]-T.done[p]);
    if(n>rem){err(t('qOver',{p:t('p_'+p),r:nf(rem)}));return;}
    adds.push([p,n]);
  }
  if(!adds.length){err(t('qNone'));return;}
  adds.forEach(a=>{
    const id='q-'+date+'-'+a[0],ex=state.entries.get(id);
    put(id,{kind:'qada',prayer:a[0],date:date,count:(ex&&ex.kind==='qada'?ex.count:0)+a[1],at:Date.now()});
  });
  closeM();showToast(t('qSaved'));
});

/* ---------- popups + toast ---------- */
let openModal=null,lastFocus=null,toastTimer=null;
function openM(el,focusSel){
  lastFocus=document.activeElement;openModal=el;
  el.hidden=false;document.body.style.overflow='hidden';
  setTimeout(()=>{const f=el.querySelector(focusSel);if(f)f.focus();},0);
}
function closeM(){
  if(!openModal)return;
  openModal.hidden=true;openModal=null;document.body.style.overflow='';
  state.editId=null;
  if(lastFocus&&lastFocus.focus)lastFocus.focus();
}
function openAdd(id){
  const e=id?state.entries.get(id):null;
  state.editId=(e&&e.kind==='tinggal')?id:null;
  if(state.editId){
    $('#fy').value=e.years||'';$('#fm').value=e.months||'';$('#fd').value=e.days||'';
    PR.forEach(p=>{$('#c_'+p).checked=e.prayers.indexOf(p)>=0;});
    $('#fnote').value=e.note||'';
  }else{
    ['#fy','#fm','#fd','#fnote'].forEach(s=>{$(s).value='';});
  }
  $('#addMsg').textContent='';$('#addMsg').className='msg';
  updateAddLabels();renderPreview();
  openM($('#addModal'),'#fy');
}
function openQada(){
  const T=totals(),today_=today();
  $('#qDate').value=today_;$('#qDate').max=today_;
  PR.forEach(p=>{
    $('#q_'+p).value='';
    $('#qr_'+p).textContent=t('qLeft',{n:nf(Math.max(0,T.tot[p]-T.done[p]))});
  });
  $('#qMsg').textContent='';$('#qMsg').className='msg';
  openM($('#qadaModal'),'#qDate');
}
function showToast(text){
  const el=$('#toast');el.textContent=text;el.hidden=false;
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>{el.hidden=true;},2500);
}
$('#openAdd').addEventListener('click',()=>openAdd(null));
$('#openQada').addEventListener('click',openQada);
$('#closeAdd').addEventListener('click',closeM);
$('#closeQada').addEventListener('click',closeM);
$('#addModal').addEventListener('click',e=>{if(e.target===$('#addModal'))closeM();});
$('#qadaModal').addEventListener('click',e=>{if(e.target===$('#qadaModal'))closeM();});
document.addEventListener('keydown',e=>{
  if(!openModal)return;
  if(e.key==='Escape'){closeM();return;}
  if(e.key==='Tab'){
    const f=Array.from(openModal.querySelectorAll('button,input')).filter(x=>!x.disabled&&x.offsetParent!==null);
    if(!f.length)return;
    const first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
  }
});

/* ---------- events ---------- */
$('#plist').addEventListener('click',e=>{
  const b=e.target.closest('button[data-act]');if(!b||b.disabled)return;
  if(b.dataset.act==='inc')addQada(b.dataset.p,Number(b.dataset.n));else undoQada(b.dataset.p);
});
$('#allOne').addEventListener('click',()=>{PR.forEach(p=>addQada(p,1));});
function selectDate(k){
  state.selDate=k;
  const a=k.split('-').map(Number);state.cal={y:a[0],m:a[1]-1};
  renderTracker();
}
$('#trkList').addEventListener('click',e=>{
  const b=e.target.closest('button[data-tp]');if(!b)return;
  const p=b.dataset.tp,v=b.dataset.v;
  setStatus(state.selDate,p,v);
  const nb=document.querySelector('#trkList button[data-tp="'+p+'"][data-v="'+v+'"]');
  if(nb)nb.focus();
});
$('#trkPrev').addEventListener('click',()=>{if(state.selDate>'2000-01-01')selectDate(shiftDate(state.selDate,-1));});
$('#trkNext').addEventListener('click',()=>{if(state.selDate<today())selectDate(shiftDate(state.selDate,1));});
$('#trkToday').addEventListener('click',()=>selectDate(today()));
$('#calGrid').addEventListener('click',e=>{
  const b=e.target.closest('button[data-date]');if(!b||b.disabled)return;
  const k=b.dataset.date;
  state.selDate=k;renderTracker();
  const nb=document.querySelector('#calGrid button[data-date="'+k+'"]');
  if(nb)nb.focus();
});
function moveMonth(n){
  const d=new Date(state.cal.y,state.cal.m+n,1);
  state.cal={y:d.getFullYear(),m:d.getMonth()};
  renderCalendar();
}
$('#calPrev').addEventListener('click',()=>moveMonth(-1));
$('#calNext').addEventListener('click',()=>{if(!$('#calNext').disabled)moveMonth(1);});
$('#goalMinus').addEventListener('click',()=>putSettings({goal:Math.max(0,state.settings.goal-1)}));
$('#goalPlus').addEventListener('click',()=>putSettings({goal:Math.min(500,state.settings.goal+1)}));
$('#goalInput').addEventListener('change',e=>{
  const v=Math.floor(Number(e.target.value));
  putSettings({goal:(isFinite(v)&&v>=0)?Math.min(v,500):state.settings.goal});
});
$('#bannerLater').addEventListener('click',()=>putSettings({snoozeUntil:Date.now()+864e5}));
$('#bannerNow').addEventListener('click',()=>{doExport(true);});
document.addEventListener('click',e=>{
  const lb=e.target.closest('button[data-lang]');
  if(lb){lang=lb.dataset.lang;try{localStorage.setItem('qada.lang',lang);}catch(x){}applyLang();renderAll();return;}
  const fb=e.target.closest('button[data-filter]');
  if(fb){
    state.filter=fb.dataset.filter;state.limit=50;
    qsa('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b===fb)));
    renderHistory();return;
  }
  const hb=e.target.closest('button[data-hact]');
  if(hb){
    const a=hb.dataset.hact;
    if(a==='ask'){state.pendingDelete=hb.dataset.id;renderHistory();}
    else if(a==='no'){state.pendingDelete=null;renderHistory();}
    else if(a==='yes'){const id=hb.dataset.id;state.pendingDelete=null;remove(id);}
    else if(a==='edit'){openAdd(hb.dataset.id);}
  }
});
$('#moreBtn').addEventListener('click',()=>{state.limit+=50;renderHistory();});

/* ---------- backup ---------- */
function backupMsg(k,p,err){const el=$('#backupMsg');el.className='msg'+(err?' err':'');el.textContent=k?t(k,p):'';}
function exportJson(){
  return JSON.stringify({app:'qada-solat',version:2,exportedAt:new Date().toISOString(),
    settings:{goal:state.settings.goal},
    entries:Array.from(state.entries).map(a=>Object.assign({id:a[0]},a[1]))},null,2);
}
function showFallback(){$('#fallbackBox').hidden=false;$('#fallbackTa').value=exportJson();}
function markBackup(){putSettings({lastBackup:Date.now(),snoozeUntil:0});}
async function doExport(fromBanner){
  if(!state.entries.size){backupMsg('noData',null,true);return;}
  const done=()=>{markBackup();backupMsg('exported');if(fromBanner)showToast(t('exported'));};
  if(!downloads){
    try{
      const blob=new Blob([exportJson()],{type:'application/json'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url;a.download='qada-solat-'+today()+'.json';
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),10000);
      done();
    }catch(e){showFallback();backupMsg('exportFail',null,true);}
    return;
  }
  try{
    await downloads.save({filename:'qada-solat-'+today()+'.json',data:exportJson()});
    done();
  }catch(e){
    if(e&&e.code==='declined'){backupMsg('cancelled');}
    else{showFallback();backupMsg('exportFail',null,true);}
  }
}
$('#exportBtn').addEventListener('click',()=>{doExport(false);});
$('#copyBtn').addEventListener('click',async()=>{
  const ta=$('#fallbackTa');ta.value=exportJson();
  try{await navigator.clipboard.writeText(ta.value);markBackup();backupMsg('copied');}
  catch(e){ta.select();backupMsg('copyManual');}
});
$('#importBtn').addEventListener('click',()=>{$('#importFile').click();});
$('#importFile').addEventListener('change',async e=>{
  const f=e.target.files&&e.target.files[0];e.target.value='';
  if(!f)return;
  try{
    if(f.size>5*1024*1024)throw new Error('big');
    const j=JSON.parse(await f.text());
    const arr=Array.isArray(j)?j:(j&&Array.isArray(j.entries)?j.entries:null);
    if(!arr)throw new Error('shape');
    const items=[],seen=new Set();
    arr.slice(0,5000).forEach(r=>{
      const rec=clean(r);if(!rec)return;
      let id=r&&typeof r.id==='string'&&idUsable(r.id)?r.id:newId();
      while(seen.has(id))id=newId();
      seen.add(id);items.push({id:id,rec:rec});
    });
    if(!items.length)throw new Error('empty');
    const g=j&&!Array.isArray(j)&&j.settings?Math.floor(Number(j.settings.goal)):NaN;
    state.importGoal=(isFinite(g)&&g>=0)?Math.min(g,500):null;
    state.importItems=items;
    $('#importInfo').textContent=t('importFound',{n:nf(items.length)});
    $('#importBox').hidden=false;backupMsg('');
  }catch(err){state.importItems=null;$('#importBox').hidden=true;backupMsg('badFile',null,true);}
});
async function runImport(replace){
  const items=state.importItems,goal=state.importGoal;if(!items)return;
  state.importItems=null;state.importGoal=null;$('#importBox').hidden=true;
  await bulkApply(items,replace);
  if(replace&&goal!==null)putSettings({goal:goal});
  backupMsg('imported',{n:nf(items.length)});
}
$('#impMerge').addEventListener('click',()=>runImport(false));
$('#impReplace').addEventListener('click',()=>runImport(true));
$('#impCancel').addEventListener('click',()=>{state.importItems=null;$('#importBox').hidden=true;backupMsg('cancelled');});

/* ---------- boot ---------- */
state.selDate=today();
{const n=new Date();state.cal={y:n.getFullYear(),m:n.getMonth()};}
applyLang();
renderAll();
(async function(){
  const c=window.claude;
  if(!c||!c.use){goLocal();return;}
  try{
    const r=await Promise.all([c.use('db'),c.use('user'),c.use('downloads')]);
    downloads=r[2]||null;
    if(r[0]&&r[1]){
      uid=await r[1].id();
      if(uid){db=r[0];startDb();return;}
    }
  }catch(e){}
  goLocal();
})();
})();
</script>
